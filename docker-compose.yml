services:
  api:
    build: .
    env_file: .env
    environment:
      PAPERS_DIR: /papers
      DATA_DIR: /data
      API_PUBLIC_URL: http://localhost:8000
    volumes:
      - ./papers:/papers          # PDFs (uploads are written to ./papers/uploads)
      - ./data/docker:/data       # index + caches (separate from the local-run ./data)
      - hf-models:/models         # downloaded embedding / reranker models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  hf-models:
